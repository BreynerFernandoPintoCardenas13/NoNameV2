services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nonamev2
    ports:
      # 5433 en el host para no chocar con el Postgres local (5432)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nonamev2"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/nonamev2?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENPROJECT_BASE_URL: ${OPENPROJECT_BASE_URL}
      OPENPROJECT_API_KEY: ${OPENPROJECT_API_KEY}
    ports:
      - "3000:3000"

volumes:
  pgdata:
